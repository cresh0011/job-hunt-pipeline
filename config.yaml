# ============================================================
#  求职流水线 — 匹配与打分配置
#
#  改完直接重跑 `python scripts/score.py` 即可生效，无需改代码。
#  所有权重按你自己的方向调 —— 下面是「大模型 / Agent 应用开发」方向的示例值。
# ============================================================

# ------------------------------------------------------------
# 个人信息
#  ⚠️ 这里会被 build_autofill.py 用来自动生成网申填表书签。
#     如果你打算把项目推到公开仓库，请把本文件加进 .gitignore，
#     或者只填占位符、把真实信息放在 config.local.yaml 里。
# ------------------------------------------------------------
profile:
  name: 你的姓名
  school: 你的学校
  major: 你的专业
  degree: 本科
  graduation: "2027-06"
  email: you@example.com
  phone: "13800138000"
  targets:
    - 大模型应用开发
    - Agent 开发
    - 后端开发

# ------------------------------------------------------------
# 城市权重：命中的城市加分（取最高值，不累加，避免"多地"占便宜）
# ------------------------------------------------------------
city_weights:
  上海: 15
  北京: 6
  杭州: 6
  深圳: 5
  广州: 4
  成都: 3
  南京: 3
  苏州: 3
  武汉: 3
  西安: 2
  其他: 0

# ------------------------------------------------------------
# 关键词权重：岗位文本命中即加分
#  ⚠️ 同一类别里的**同义词不要累加计分**（见 score.py 的 _best()）。
#     比如「计算机类」和「计算机科学与技术」是同一件事的两种写法，
#     累加会让岗位凭空多出几十分，把完全不对口的职位顶到前排。
# ------------------------------------------------------------
keyword_weights:
  # 第一梯队 —— 与目标方向完全对口
  大模型: 12
  LLM: 12
  Agent: 12
  智能体: 12
  RAG: 12
  检索增强: 12
  # 第二梯队
  AIGC: 9
  生成式: 9
  LangChain: 9
  向量数据库: 9
  微调: 8
  LoRA: 8
  SFT: 8
  Prompt: 8
  推理加速: 8
  vLLM: 8
  AI应用: 8
  AI开发: 8
  AI工程: 8
  多模态: 7
  自然语言: 7
  NLP: 7
  智能问答: 7
  对话系统: 7
  # 第三梯队 —— 相关但非核心
  Python: 6
  算法工程师: 6
  机器学习: 5
  深度学习: 5
  后端: 5
  服务端: 5
  FastAPI: 5
  MySQL: 4
  Redis: 4
  微服务: 4
  消息队列: 3
  Docker: 3
  Kubernetes: 3
  K8s: 3
  数据挖掘: 4
  开发工程师: 4
  研发工程师: 4
  测试开发: 3

# ------------------------------------------------------------
# 负向关键词：命中即减分
#  ⚠️ 只在**岗位名**里生效，不看 JD 正文 —— 正文里出现「运营」「财务」
#     往往是在描述协作方，不是岗位本身（见 score.py 的 score_soe()）。
# ------------------------------------------------------------
negative_keywords:
  销售: -40
  客服: -40
  售前: -35
  售后: -35
  外包: -30
  驻场: -30
  美工: -30
  UI设计: -30
  市场专员: -25
  人力资源: -25
  行政: -25
  财务: -25
  文秘: -35
  档案: -30
  党群: -35
  出纳: -35
  会计: -30
  采购: -25
  仓储: -25
  物流: -20
  实施工程师: -15
  运维工程师: -8
  运营: -8
  # 国企央企里大量「要求计算机专业、但岗位本身不是技术岗」的职位，
  # 它们靠专业匹配拿分，需要负向词压下去
  消防: -30
  安全员: -30
  维护工: -30
  化验: -30
  冶炼: -25
  采矿: -30
  施工: -25
  巡检: -25
  法务: -30

# ------------------------------------------------------------
# 行业权重（对应聚合源的 industry 字段）
# ------------------------------------------------------------
industry_weights:
  AI: 10
  人工智能: 10
  互联网科技: 8
  机器人: 7
  半导体: 6
  芯片: 6
  外企: 5
  汽车制造: 4
  装备重工: 3
  银行金融: 2
  央企国企: 2
  国企: 2

# ------------------------------------------------------------
# 批次：正职 vs 实习
# ------------------------------------------------------------
batch_rules:
  # 命中这些词直接降权（不是排除，仍是备选）
  deprioritize:
    实习: -25
    提前批: 0
    正式批: 3
    秋招: 2

# ------------------------------------------------------------
# 学历匹配：按你自己的学历调
#  ⚠️ 同样要取最高值而非累加 ——「本科及以上」包含「本科」，
#     累加会重复计分。
# ------------------------------------------------------------
education_weights:
  不限: 3
  本科: 5
  本科及以上: 5
  大专: -15
  硕士: -45
  硕士及以上: -45
  研究生: -45
  博士: -70

# ------------------------------------------------------------
# 专业匹配
# ------------------------------------------------------------
major_weights:
  计算机类: 20
  计算机科学与技术: 20
  软件工程: 18
  电子信息类: 10
  自动化类: 8
  数学类: 8
  统计学类: 6
  通信: 6

# ------------------------------------------------------------
# 数据源
#  技术岗与国央企严格分开：不同的源、不同的表、不同的报告分区。
#
#  ⚠️ 这些社区聚合仓库由个人维护，可能停更。任一失效不影响其他源，
#     原始快照会留档在 data/raw/，便于迁移。
# ------------------------------------------------------------
sources:
  tech:
    - name: xiaozhao-radar
      # 约 1600 条，含行业标签与投递链接
      url: https://raw.githubusercontent.com/jiabaobei/xiaozhao-radar/main/jobs.json
      format: radar
    - name: xixicc2027
      # 结构最规整，含批次与 deadline
      url: https://raw.githubusercontent.com/xixicc186/xixicc2027/main/jobs.json
      format: xixicc
  soe:
    - name: iguopin
      # 国聘网：推荐池约 400 槽位，其中约 267 条为校园招聘。
      #
      # ⚠️ 这是「推荐池」接口，不是稳定列表 —— 分页会重叠
      #    （实测 page1∩page2≈5 条），每次返回的切片会变。
      #    去重后靠每日重跑逐步覆盖全量，这不是 bug。
      #    实测 page_size=20 能拿到 400 槽位；调到 50 反而只返回 140 条。
      #
      # ⚠️ 返回的 min_wage/max_wage 是粗略挂网值，**严重低估实际待遇**。
      #    想看真实薪酬福利，要去查公司的官方校招公告。
      api: https://gp-api.iguopin.com/api/jobs/v1/recom-job
      referer: https://www.iguopin.com/job/list
      page_size: 20
      max_pages: 25
    - name: ncss
      # 国家大学生就业服务平台：补充源，贡献有限。
      # 实测匿名访问每查询实际只返回 20 条（官方文档称 100 条，不符）；
      # offset 分页参数无效；property 除「国有企业」外其余取值均返回空。
      api: https://ncss.cn/student/jobs/jobslist/ajax/
      properties: [国有企业]
      page_size: 20

# ------------------------------------------------------------
# 看板
# ------------------------------------------------------------
dashboard:
  title: 校招看板
  top_n: 60
  deadline_warn_days: 7   # 距截止几天内标红
  new_days: 3             # 几天内视为「新增」
