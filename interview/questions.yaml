# ============================================================
#  面试题库
#
#  每题的结构：
#    q          问题本身
#    intent     面试官问这个想验证什么（知道意图才知道该答什么）
#    follow_ups 追问链 —— 真实的面试是连环追问，只准备第一层会卡在第二层
#
#  trigger_keywords 用于按 JD 过滤：命中的分类优先输出。
#  改完跑 `python scripts/build_questions.py` 生效。
#
#  ⚠ YAML 坑：以 * & ! % @ ` 开头的**裸值**会被解析成别名/锚点/标签而报错。
#  想强调时用 >- 折叠块标量包一层（本文件里已有两处这样处理），或直接用引号。
# ============================================================

tracks:

  # ==========================================================
  - id: rag-project
    title: 法律 RAG 项目深挖
    trigger_keywords: [RAG, 检索, 检索增强, 大模型, LLM, 向量, 知识库]
    priority: 1        # 这是简历上最强的一块，面试必问
    intro: |
      这块是你简历的核心，面试官会花最多时间在这里。
      回答时的总原则：**主动划清"团队给的"和"我做的"**，然后把你自主
      决策的部分讲深（切分粒度对比、消融实验、评测集设计、三处度量缺陷）。
    questions:
      - q: 先用两分钟讲一下这个项目的背景，以及你具体负责哪部分。
        intent: 开场必问。看你的自述和简历是否一致——简历上已经写清了分工，答不一致会立刻暴露。
        follow_ups:
          - 你说框架方向是团队定的，具体定到什么颗粒度？给的是目标，还是连技术选型都定了？
          - 哪些地方你做了和初始方案不一样的决定？为什么？
      - q: 「语义切分」具体是怎么切的？按什么单位？
        intent: 检索质量的地基。答不出切分策略，说明只是调了库没理解原理。
        follow_ups:
          - 法律条文有编/章/节/条/款层级，你切到哪一级？
          - 单个"条"特别长怎么办？
          - 切分后有 overlap 吗？多少？为什么这么定？
      - q: 你对比了 2804 和 3924 两种切分粒度，这两个数是怎么来的？
        intent: 验证实验是否真做过。数字如此具体，没做过编不出来。
        follow_ups:
          - 为什么恰好是这两个粒度？中间值试过吗？
          - 哪个更好？好多少？
          - 粒度对 MRR 和 Hit@1 的影响一样吗？为什么？
      - q: 混合检索是怎么混合的？BM25 和稠密向量如何融合？
        intent: 混合检索是 RAG 的核心技术点，也是最能区分"用过"和"懂了"的地方。
        follow_ups:
          - 用 RRF 还是加权求和？权重怎么定的？
          - 两边各召回多少条？为什么？
          - 融合后为什么还要重排？不能直接取 top-k 吗？
      - q: 重排用的什么模型？为什么选它？
        follow_ups:
          - cross-encoder 和 bi-encoder 的本质区别是什么？
          - 重排的延迟多少？上线会不会成为瓶颈？
          - 你提到"重排截断使 Hit@10 结构性封顶"，具体是什么情况？
      - q: 四组消融实验分别是什么？怎么保证每组只变一个变量？
        intent: 消融设计体现实验素养，是研究生级别的考察点。
        follow_ups:
          - 哪个环节增益最大？
          - 有没有哪个环节是负增益的？怎么处理的？
      - q: 100 条评测集是怎么建的？"锚定原文区间"具体指什么？
        intent: 评测集的质量决定所有指标的可信度。这是最容易被问穿的地方。
        follow_ups:
          - 100 条够吗？样本量带来的置信区间有多宽？
          - 谁标的？如果是你自己标，怎么保证不是自证？
          - 有没有标错的样本？发现后怎么处理？
      - q: MRR 从 0.6804 提到 0.8833，分解到各个环节分别是多少贡献？
        follow_ups:
          - Hit@1 提升 43.9% 但 MRR 只提升 29.8%，为什么差这么多？
          - 这两个指标的差异说明了什么？
      - q: 你发现的三处度量缺陷，挑一个展开讲讲。
        intent: >-
          **这是你最强的故事** —— 能质疑评测方法本身，比任何指标数字都有分量。
        follow_ups:
          - 是意外发现的，还是主动排查出来的？
          - 如果不修，会得出什么错误结论？
          - 这件事让你对"看指标"有什么新的认识？
      - q: 过滤器误杀 96% 评测样本——96% 这个数字怎么来的？
        follow_ups:
          - 为什么误杀率这么高？
          - 修复后指标变化多少？
      - q: 纯 BM25 在该语料上与完整流水线 Hit@5 持平，这个结论对你的方案意味着什么？
        intent: 如何对待负结果，最能看出工程判断力。多数人会藏起来，坦白讲反而加分。
        follow_ups:
          - 那你的稠密检索加重排，到底带来了什么价值？
          - 重新设计一次会怎么做？
          - 这个结论能推广到其他语料吗？边界在哪？
      - q: LoRA 微调 Qwen2.5-1.5B，rank 怎么选的？训练数据从哪来？
        follow_ups:
          - LoRA 为什么能省显存？原理是什么？
          - rank 太小会怎样？太大呢？
          - 微调带来了多少提升？它和 RAG 是替代还是互补关系？
      - q: SSE 流式输出怎么实现的？和 WebSocket 相比如何取舍？
      - q: 110 万字语料，向量化用的什么模型？耗时多久？
      - q: 这套系统如果要上线，你认为瓶颈在哪？

  # ==========================================================
  - id: title-cls
    title: 商品标题分类项目深挖
    trigger_keywords: [分类, NLP, BERT, 文本, 微调, Python, 后端]
    priority: 2
    intro: |
      这个项目工程完整度高（四个模块、训练推理复用清洗逻辑），但注意：
      **数据集是随机生成的仿真数据，任何准确率都不能说。** 被问到时如实说明。
    questions:
      - q: 为什么把系统切成数据处理、模型训练、批量推理、HTTP 服务四个模块？
        follow_ups:
          - 所谓"模块间单向依赖"具体怎么保证的？有循环依赖怎么办？
          - 单模块可独立运行，是怎么做到的？
      - q: 分层抽样切分是什么？为什么不用随机切分？
        intent: 考察是否理解类别不平衡问题。
      - q: 分层学习率预热具体怎么实现的？为什么需要预热？
        follow_ups:
          - 预热多少步？怎么定的？
          - 不预热会怎样？
      - q: 训练和推理复用同一个清洗函数——为什么这一点重要？
        intent: 训练-推理分布不一致是工程上极常见又极隐蔽的 bug。
        follow_ups:
          - 不复用会出什么问题？现象是什么样的？
          - 你是怎么想到要统一这一点的？
      - q: FastAPI 的 lifespan 机制是什么？不用它会怎样？
        follow_ups:
          - 每个请求都加载一次模型会有什么后果？
          - 多 worker 部署时模型会加载几次？
      - q: 设备自适应降级是怎么实现的？
      - q: ⚠️ 这个项目的数据集是怎么来的？
        intent: >-
          **必被问到，且必须如实回答**。数据集是随机生成的仿真数据。
        follow_ups:
          - 那你的准确率指标有意义吗？
        answer_hint: |
          如实说明是随机生成的仿真数据，指标不具备真实意义。
          然后主动把话题引到**工程实现**上——这个项目的价值在四模块架构、
          训练-推理一致性、服务化部署，不在模型效果。
          主动坦白比被追问出来强得多，而且能体现工程诚实。

  # ==========================================================
  - id: internship
    title: 实习分工与协作
    trigger_keywords: [实习, 团队, 协作, 沟通]
    priority: 1
    intro: |
      岗位要求的四项能力，事实库里的对应情况已经在 facts.yaml 里记着了。
      这一组问题全部围绕"你在团队里到底扮演什么角色"。
    questions:
      - q: 你们团队多少人？你和大模型算法工程师的分工是什么？
      - q: 同事 review 你的代码时提过什么意见？你怎么处理的？
        intent: 考察能否接受批评、是否有工程规范意识。
        follow_ups:
          - 有没有你当时不认同、后来发现对方是对的？
          - 你 review 过别人的代码吗？
      - q: 你负责的模块出过线上问题吗？怎么定位和修复的？
        follow_ups:
          - 如果没出过，说说你做过的最难排查的一个 bug。
      - q: 实习期间最大的困难是什么？
      - q: 为什么实习结束后没有留下来？
        answer_hint: 不要说前公司坏话。聚焦"想找更聚焦大模型应用方向的岗位"这类发展性理由。

  # ==========================================================
  - id: fundamentals
    title: 技术基础
    trigger_keywords: [大模型, LLM, Transformer, 算法, 深度学习, NLP, Python]
    priority: 2
    questions:
      - q: 讲一下 self-attention 的计算过程。
        follow_ups:
          - 为什么要除以根号 d_k？
          - 为什么需要多头注意力？单头不行吗？
      - q: LayerNorm 放在 attention 前和放在后面（pre-LN vs post-LN）有什么区别？
      - q: BERT 和 GPT 在架构和训练目标上的本质区别是什么？
        intent: 你的简历把 BERT 和 LLaMA/Qwen 都列了，这里很可能被追问。
      - q: vLLM 的 PagedAttention 解决了什么问题？
        follow_ups:
          - 不用它的话显存浪费在哪？
          - 为什么能提升吞吐？
      - q: 量化有哪些常见方法？INT8 和 INT4 如何取舍？
        follow_ups:
          - 量化会损失什么？
          - 你实际用过哪种？
      - q: RAG 和微调各自的适用场景是什么？什么时候该用哪个？
        intent: 高频题，且和你的项目直接相关。
        follow_ups:
          - 什么情况下两者要一起用？
      - q: 怎么缓解大模型的幻觉问题？
        follow_ups:
          - 你项目里做了哪些？
          - 检索到错误内容时怎么办？
      - q: 讲一下你理解的 Agent，和普通的 function calling 有什么区别？
        follow_ups:
          - Agent 的工具调用失败了怎么处理？
          - 多轮对话的上下文怎么管理？

  # ==========================================================
  - id: behavioral
    title: 行为面试
    trigger_keywords: []
    priority: 3
    questions:
      - q: 为什么选择大模型应用这个方向？
        answer_hint: 结合实习里"发现评测方法有问题"的经历讲——它证明你对这个方向是真心投入，不只是追热点。
      - q: 你觉得自己最大的优势和劣势是什么？
        follow_ups:
          - 劣势能举个例子吗？你为此做了什么改变？
      - q: 举一个你和同事产生分歧的例子，最后怎么解决的？
      - q: 为什么选择我们公司？
        answer_hint: 面试前必须查清对方公司的大模型落地场景，泛泛而谈会立刻减分。
      - q: 未来三年的规划？
      - q: 你还投了哪些公司？进展如何？
        answer_hint: 可以如实说有其他流程在推进（体现市场认可），但不要说具体给了什么 offer 来施压。
      - q: 能接受的到岗时间是什么时候？

  # ==========================================================
  - id: to-ask
    title: 反问环节
    trigger_keywords: []
    priority: 3
    intro: |
      反问是加分项，也是你判断这家公司值不值得去的机会。
      不要问"公司福利怎么样"这类招聘网站上能查到的。
    questions:
      - q: 团队目前大模型应用的主要落地场景是什么？在什么阶段？
      - q: 这个岗位新人前三个月大概会做什么？
        intent: 能看出岗位是否成熟、有没有培养体系。
      - q: 团队的技术栈和工具链是怎样的？模型是自己训还是调 API？
        intent: 判断你在这里能积累到什么。
      - q: 团队怎么评估大模型应用的线上效果？
        intent: 这个问题会让人眼前一亮——它和你在实习里"质疑评测方法"的经历呼应。
      - q: 新人有没有 mentor 机制？
