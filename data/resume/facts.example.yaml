# ============================================================
#  事实库示例 —— 复制成 facts.yaml 后改成你自己的内容
#
#    cp data/resume/facts.example.yaml data/resume/facts.yaml
#
#  【最重要的一条设计】
#  这是整个项目的地基。简历生成脚本只允许「选择、排序、改写措辞」，
#  绝不允许引入本文件没有的事实（新的项目、夸大的指标、没做过的技术）。
#
#  为什么这么做：简历造假在面试追问和入职背调阶段会直接出局，
#  而 AI 生成简历最容易犯的错就是"顺手补一个合理的数字"。
#  把事实锁死在结构化文件里，是从机制上防止这件事。
#
#  如果某个岗位需要这里没有的能力 —— 正确做法是承认这个 gap，
#  或者去补真实经历，而不是让 AI 编一个。
#
#  【下面的人物是虚构的，仅用于展示格式】
# ============================================================

meta:
  source_file: "你的原简历文件名.docx"
  parsed_at: "2026-01-01"
  verified_by_user: false        # 你逐条核对后改成 true

# ------------------------------------------------------------
# 基本信息
#  ⚠️ 这些字段会被 build_autofill.py 用于生成网申填表书签
# ------------------------------------------------------------
basic:
  name: 张明
  phone: "13800138000"
  email: zhangming@example.com
  student_id: "2023000000"
  location: 上海-某区
  hometown: 某省                # 建议从简历里删掉，避免无谓的筛选偏见
  birth: 2004年1月              # 同上
  github: yourname
  github_url: https://github.com/yourname

# ------------------------------------------------------------
# 求职意向
# ------------------------------------------------------------
intent:
  target_roles:
    - 大模型应用开发
    - Agent 开发
    - Python 后端
  expected_salary: 面议
  preferred_cities: [上海, 北京, 深圳, 杭州]

# ------------------------------------------------------------
# 教育经历
#  ⚠️ 毕业时间写明确日期（2027.06），不要写"至今"—— 校招 HR 需要知道
# ------------------------------------------------------------
education:
  - school: 某某大学
    major: 计算机科学与技术
    degree: 本科
    start: "2023.09"
    end: "2027.06"
    ranking: 专业排名前 20%
    courses:                    # 只列和目标岗位相关的 6-8 门就够
      - 数据结构
      - 操作系统
      - 计算机网络
      - 数据库
      - 机器学习
      - 人工智能

# ------------------------------------------------------------
# 荣誉奖项
#  ⚠️ 数字必须准确。背调时会核验，写错了比不写严重得多。
# ------------------------------------------------------------
honors:
  - name: 校级一等奖学金
    date: "2024.09"
    count: 1
  - name: 校级二等奖学金
    date: "2023.09-2025.07"
    count: 2

# ------------------------------------------------------------
# 实习 / 实践经历
#  ⚠️ 如果实习内容和下面某个项目是同一件事，这里只留一条中性总括，
#     细节全部让给「项目经历」—— 两栏重复叙述会显得注水。
# ------------------------------------------------------------
experiences:
  - org: 某某科技有限公司
    role: AI 应用开发实习生
    start: "2026.06"
    end: "2026.09"
    bullets:
      - 参与大模型应用模块的开发与测试
    related_project: 某某检索系统

# ------------------------------------------------------------
# 校园经历
# ------------------------------------------------------------
campus:
  - org: 某某志愿服务队
    role: 队长
    start: "2023.09"
    end: "2025.09"
    bullets:
      - 统筹校内外志愿项目，牵头保障公益活动

# ------------------------------------------------------------
# 项目经历
#
#  写项目要点的三条经验：
#    1. 量化。没有数字的"优化了性能"等于没写。
#    2. 写你**自主决策**的部分，不只是"我写了多少代码"——
#       前者证明判断力，后者只证明执行力。
#    3. 负结果也值得写。"发现 X 方案没效果，据此界定了边界"
#       比任何漂亮指标都更能体现工程素养。
# ------------------------------------------------------------
projects:
  - name: 某某检索增强系统
    role: 方案设计与实现       # ⚠️ 措辞要符合真实分工，见下方 division_of_labor
    org: 某某科技有限公司
    year: "2026.06-2026.09"
    stack: [Python, 向量检索, 混合检索, 重排, FastAPI]
    summary: 一句话说清做了什么、规模多大。
    bullets:
      - 实现「解析 → 切分 → 向量化 → 检索 → 重排」完整链路，基于 N 份文档构建检索系统
      - 设计四组消融实验（每组只变一个变量），自建 N 条评测集；量化各环节增益
      - 定位并修正三处导致指标失真的度量缺陷
    # 真实分工 —— 这栏是给自己看的，不直接出现在简历上，
    # 但决定了 role 字段怎么写，也是面试被追问时的底稿
    division_of_labor:
      given_by_others: 技术框架与研究方向
      done_by_self: 方案设计、链路实现、消融实验、评测集设计
      reviewed_by: 同事 review 与修改代码
    strength: 强

# ------------------------------------------------------------
# 职业技能
#  ⚠️ 分类要**准确**，技术面试官会挑：
#     · Scikit-Learn 是传统机器学习库，不是深度学习框架
#     · BERT 是 encoder-only 预训练模型，和 LLaMA/Qwen 这类
#       decoder-only 大语言模型不是一类，并列在「大模型」下是硬凑
# ------------------------------------------------------------
skills:
  languages: [Python, C++, Java]
  ml: [PyTorch, Scikit-Learn, HuggingFace Transformers]
  models: [BERT, LLaMA, Qwen2.5, Transformer/GPT 架构]
  application: [RAG, Agent 开发, Prompt 工程, LoRA/SFT 微调, vLLM 推理加速]
  backend: [MySQL, Redis, 消息队列, 微服务, Git, Linux, FastAPI]

# ------------------------------------------------------------
# 自我评价（只用于国央企变体，技术岗简历不加）
# ------------------------------------------------------------
self_evaluation_condensed:
  - 具备完整从业务需求到工程部署落地的项目实战经验，做事严谨负责
  - 善于团队沟通协作，执行力良好，能够抗压推进项目落地

# ============================================================
#  不该写进简历的东西
#
#  典型的例子：
#    - 报名了但还没出分的考试（四六级、软考……）
#      「报名」不等于「通过」。写了没通过的证书在背调时是诚信问题，
#      代价远大于没有这张证书。
#    - 参与过但没实际产出的项目
#    - 别人的成果
# ============================================================
